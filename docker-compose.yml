services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      APP_ENV: development
      PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 15
